name: Bug Report
description: Report a problem with this plugin
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: v1.2.3
    validations:
      required: true
  - type: input
    id: css-version
    attributes:
      label: CounterStrikeSharp version
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant console/error logs
      render: shell
